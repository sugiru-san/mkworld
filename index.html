<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKW立ち回り">
<meta name="theme-color" content="#262A33">
<title>マリカーワールド 立ち回りメモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* デザイン方針「レースのピットボード」：路面グレーの上に、道路の白い破線（センターライン）をアクセントに使う */
  :root {
    --asphalt: #262A33;    /* 背景（路面） */
    --pit: #323744;        /* パネル・ボタン */
    --pit-high: #3D4352;   /* 押せるものの明るい面 */
    --curb-red: #E4002B;   /* 縁石の赤 */
    --curb-white: #F5F3EE; /* 縁石の白・文字 */
    --coin: #FFC21A;       /* ★・選択中 */
    --item-blue: #36A9E1;  /* リンク・同期 */
    --muted: #9AA3B5;      /* 補足の文字 */
    --curb: repeating-linear-gradient(90deg, var(--curb-white) 0 18px, transparent 18px 30px);  /* センターライン */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--asphalt); color: var(--curb-white); line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--coin); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 16px; background: var(--asphalt); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--curb); }
  header h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .02em; }
  header h1 span { display: inline-block; transform: skewX(-10deg); }
  button { font: inherit; border: none; border-radius: 10px; padding: 8px 12px; background: var(--pit-high); color: var(--curb-white); cursor: pointer; }
  button.primary { background: var(--curb-red); color: #fff; font-weight: 700; }
  button.danger { background: var(--pit-high); color: var(--muted); }
  #modeBtn { font-weight: 700; }
  #modeBtn.on { background: var(--coin); color: var(--asphalt); }
  .sync { background: none; color: var(--item-blue); padding: 8px 4px; font-weight: 700; }
  .sync:empty { display: none; }
  .sheet p.note { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
  .sheet label.input { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .sheet label.input input { margin-top: 4px; }
  #syncMsg { font-size: 13px; margin-top: 10px; color: var(--muted); }
  main { padding: 12px; max-width: 1200px; margin: 0 auto; }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  #stage { position: relative; width: 100%; user-select: none; touch-action: manipulation; }
  #stage img { display: block; width: 100%; border-radius: 14px; }
  #stage.empty { border: 2px dashed var(--pit-high); border-radius: 14px; padding: 40px 16px; text-align: center; }
  .spot { position: absolute; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center;
    font-size: 11px; font-weight: 800; text-shadow: 0 0 3px #000, 0 0 3px #000; overflow: hidden; text-align: center; }
  .spot.view { border: 2px solid transparent; }
  .spot.view:active { background: rgba(255, 194, 26, .35); border-color: var(--coin); }
  .spot.view .label { display: none; }
  body.showLabels .spot.view .label { display: block; }
  .spot.edit { border: 2px solid var(--coin); background: rgba(255, 194, 26, .2); touch-action: none; }
  /* 周回・道中・SFC の切り替え：選んでいる方の下にセンターライン */
  .tabs { display: flex; gap: 4px; margin: 18px 0 10px; background: var(--pit); border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; position: relative; background: none; color: var(--muted); padding: 10px 4px 13px; font-size: 15px; font-weight: 700; border-radius: 9px; }
  .tabs button.on { background: var(--pit-high); color: var(--curb-white); }
  .tabs button.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 3px; background: var(--curb); }
  #search { margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px; }
  .grid button, .links button { background: var(--pit); color: var(--curb-white); text-align: left; font-weight: 700; padding: 10px 12px; }
  .grid button small, .links button small { display: block; color: var(--curb-white); font-weight: 400; font-size: 12px; margin-top: 3px; }
  .grid button small.none, .links button small.none { color: var(--muted); }
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(12, 14, 18, .7); display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.open { display: flex; }
  .sheet { position: relative; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; background: var(--pit); border-radius: 18px 18px 0 0;
    padding: 26px 18px calc(18px + env(safe-area-inset-bottom)); }
  /* シート上端のセンターライン：コースを開いたとき、ここがタイトルカードになる */
  .sheet::before { content: ""; position: absolute; left: 18px; right: 18px; top: 10px; height: 4px; background: var(--curb); }
  .sheet h3 { margin: 4px 0 16px; font-size: 28px; font-weight: 900; line-height: 1.25; }
  .sheet h3 .title { display: inline-block; transform: skewX(-10deg); }
  .sheet.menu h3 { font-size: 20px; }
  .sheet h4 { margin: 22px 0 8px; font-size: 14px; color: var(--muted); font-weight: 700; }
  .back { background: none; color: var(--item-blue); padding: 0 0 6px; font-weight: 700; }
  .chips { margin: 0; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; margin: 0 4px 4px 0; border-radius: 10px; background: var(--asphalt); color: var(--muted); }
  .field { margin-bottom: 16px; }
  .field .name { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .field .body { white-space: pre-wrap; line-height: 1.7; word-break: break-word; }
  .field .body a { color: var(--item-blue); }
  .field .body.blank { color: var(--muted); }
  /* 前張り ★☆☆☆☆ 打開（★が多いほど打開寄り） */
  .style-end { font-size: 15px; vertical-align: middle; color: var(--muted); font-weight: 700; margin: 0 8px; }
  .style-end:first-child { margin-left: 0; }
  .style { font-weight: 800; white-space: nowrap; color: var(--coin); letter-spacing: 1px; }
  .style.big { font-size: 34px; line-height: 1.2; vertical-align: middle; }
  .style .off { color: var(--curb-white); opacity: .55; }
  .style-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  .style-edit .star { background: none; font-size: clamp(32px, 9vw, 40px); line-height: 1.1; padding: 0 2px; color: var(--curb-white); opacity: .55; }
  .style-edit .star.on { color: var(--coin); opacity: 1; }
  .style-edit .clear { background: none; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .style-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* 主要SCに必要なキノコ（1〜3個 / 金キノ） */
  .sc { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
  .sc img { height: 18px; }
  .sc.big img { height: 34px; }
  .sc.big { flex-shrink: 0; }
  .field .name img.field-icon { height: 22px; vertical-align: middle; margin-right: 4px; }
  .sc-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .sc-item + .sc-item { border-top: 1px solid var(--pit-high); }
  .sc-item .body { min-width: 0; }
  .sc-row { background: var(--asphalt); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .sc-row .head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .sc-row .del { background: none; color: var(--muted); padding: 4px 8px; font-size: 13px; }
  .sc-row textarea { background: var(--pit); min-height: 56px; margin-top: 8px; }
  .sc-pick { display: grid; grid-template-columns: 4.5em 1fr; align-items: center; gap: 6px 8px; }
  .sc-pick .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
  .sc-pick .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .sc-pick .opts button { background: var(--pit-high); color: var(--curb-white); min-width: 44px; min-height: 40px; padding: 6px 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
  .sc-pick .opts button img { height: 24px; }
  .sc-pick .opts button.on { background: var(--coin); color: var(--asphalt); }
  .sc-item .pos { font-weight: 700; }
  .field > .sc-pick + textarea { margin-top: 8px; min-height: 56px; }
  .sc-item .memo { font-size: 14px; color: var(--muted); }
  .sc-add { background: var(--pit-high); color: var(--curb-white); width: 100%; font-weight: 700; }
  .sc-edit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sc-edit button { background: var(--pit-high); color: var(--muted); display: inline-flex; align-items: center; gap: 2px; padding: 6px 10px; min-height: 44px; }
  .sc-edit button img { height: 26px; }
  .sc-edit button.on { background: var(--coin); color: var(--asphalt); }
  /* 平均順位 */
  .rank-head { display: flex; align-items: center; gap: 10px; }
  .rank-avg { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .rank-avg small { font-size: 16px; margin-left: 2px; }
  .rank-n { font-size: 13px; color: var(--muted); font-weight: 700; }
  .rank-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .rank-actions button { font-weight: 700; }
  .rank-actions .undo { background: none; color: var(--muted); font-size: 13px; padding: 8px 6px; }
  .rank-pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
  .rank-pad button { min-height: 44px; padding: 0; font-weight: 900; font-size: 16px; }
  .rank-pad button small { font-size: 11px; margin-left: 1px; }
  /* タップで編集に入れる項目 */
  .field[data-edit] { cursor: pointer; border-radius: 10px; margin-left: -8px; margin-right: -8px; padding: 4px 8px; }
  .field[data-edit]:active { background: var(--pit-high); }
  /* 道の長さのメーター（青いゲージ） */
  .meter { display: inline-flex; gap: 3px; vertical-align: middle; }
  .meter button { width: clamp(30px, 9vw, 44px); height: 22px; padding: 0; border-radius: 0; background: var(--pit-high); }
  .meter button:first-child { border-radius: 6px 0 0 6px; }
  .meter button:last-child { border-radius: 0 6px 6px 0; }
  .meter button.on { background: var(--item-blue); }
  .meter-wrap { display: flex; align-items: center; min-height: 44px; }
  .style-tap { background: none; padding: 0 1px; font: inherit; color: inherit; }
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .links button { background: var(--pit-high); }
  input[type=text], input[type=search], input[type=password], textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px; border-radius: 10px;
    border: 2px solid transparent; background: var(--asphalt); color: var(--curb-white); }
  input:focus, textarea:focus { border-color: var(--coin); outline: none; }
  textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .row button { flex: 1; padding: 12px; }
  label.slider { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  label.slider input { width: 100%; accent-color: var(--coin); }
  /* コース名は節（<wbr> の位置）でだけ改行する。入りきらないときだけ文字の途中で折る */
  .grid button, .links button, .sheet h3, .spot .label { word-break: keep-all; overflow-wrap: anywhere; }
  /* 引っぱって更新 */
  html, body { overscroll-behavior-y: none; }
  #ptr { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); z-index: 15; display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px; background: var(--pit-high); color: var(--curb-white); font-size: 13px; font-weight: 700;
    transform: translate(-50%, -80px); opacity: 0; pointer-events: none; }
  #ptr .arrow { display: inline-block; transition: transform .15s; }
  #ptr.ready .arrow { transform: rotate(180deg); }
  #ptr.ready { background: var(--coin); color: var(--asphalt); }
  /* トースト：画面下に短く出るお知らせ */
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 40; max-width: calc(100% - 32px);
    padding: 10px 18px; border-radius: 12px; background: var(--curb-white); color: var(--asphalt); font-size: 14px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--curb-red); color: #fff; }
  /* スケルトン：マップ画像や最初のメモを読み込んでいる間の仮の形 */
  .skel { background: linear-gradient(90deg, var(--pit) 0%, var(--pit-high) 50%, var(--pit) 100%); background-size: 200% 100%;
    animation: skel 1.2s ease-in-out infinite; border-radius: 10px; }
  @keyframes skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  #stage.loading { aspect-ratio: 1195 / 1059; border-radius: 14px; }
  #stage.loading img, #stage.loading .spot { visibility: hidden; }
  .grid .skel { height: 58px; }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } #toast { transition: none; } }
  .menu button { display: block; width: 100%; margin-bottom: 8px; text-align: left; background: var(--pit-high); color: var(--curb-white); }
</style>
</head>
<body>
<header>
  <h1><span>立ち回りメモ</span></h1>
  <button id="syncState" class="sync"></button>
  <button id="modeBtn">編集</button>
  <button id="menuBtn">☰</button>
</header>

<div id="toast" role="status" aria-live="polite"></div>
<div id="ptr"><span class="arrow">↓</span><span id="ptrText">引っぱって更新</span></div>
<main>
  <p class="hint" id="hint"></p>
  <div id="stage"></div>
  <div class="tabs">
    <button data-tab="course">周回 30</button>
    <button data-tab="route">道中 202</button>
    <button data-tab="sfc">SFC 10</button>
  </div>
  <input type="search" id="search" placeholder="コース名で絞り込み（例：ワリオ）">
  <div class="grid" id="list"></div>
</main>

<!-- メモの表示・編集シート -->
<div class="sheet-bg" id="noteBg"><div class="sheet" id="noteSheet"></div></div>
<!-- メニューシート -->
<div class="sheet-bg" id="menuBg"><div class="sheet menu">
  <h3>メニュー</h3>
  <button id="mSync">☁ GitHub同期の設定</button>
  <button id="mImage">🖼 背景画像（コース選択画面）を変更</button>
  <button id="mLabels">🏷 閲覧モードでコース名を表示：<span id="labelState"></span></button>
  <button id="mFields">📝 メモ項目を編集</button>
  <button id="mPreset">📍 マップとコース枠を初期配置に戻す</button>
  <button id="mExport">⬇ データを書き出し（バックアップ）</button>
  <button id="mImport">⬆ データを読み込み</button>
  <button class="danger" id="mClose">閉じる</button>
  <p class="hint" id="appVersion"></p>
</div></div>

<!-- GitHub同期の設定シート -->
<div class="sheet-bg" id="syncBg"><div class="sheet">
  <h3>☁ GitHub同期の設定</h3>
  <p class="note">メモを非公開のGitHubリポジトリ（data.json）に保存し、PC・iPhone・iPadで共有します。
    保存すると数秒でGitHubに反映され、ほかの端末ではツールを開き直したとき（アプリに戻ったとき）に読み込まれます。</p>
  <label class="input">GitHubのユーザー名<input type="text" id="sOwner" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label class="input">データ用リポジトリ名<input type="text" id="sRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mkworld-data"></label>
  <label class="input">アクセストークン（github_pat_ で始まる文字列）<input type="password" id="sToken" autocomplete="off"></label>
  <p class="note">トークンはこの端末の中だけに保存され、GitHub以外には送られません。</p>
  <div class="row">
    <button class="danger" id="sOff">同期を解除</button>
    <button class="primary" id="sSave">保存して同期</button>
  </div>
  <div class="row"><button id="sClose">閉じる</button></div>
  <div id="syncMsg"></div>
</div></div>

<input type="file" id="imageFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<!-- 道中コース・SFCコースの一覧データ（CIRCUIT_TAGS / SFC_COURSES / ROUTES） -->
<script src="courses-data.js"></script>
<script>
const STORAGE_KEY = 'mkworld-notes-v1';
// 更新したら日付を変える（古い画面がキャッシュで残っていないか、メニューで確かめるため）
const APP_VERSION = '2026-11-01v';
const DEFAULT_FIELDS = ['立ち回り', '主要SC', 'キラーポイント', 'サンダーポイント'];
const OLD_DEFAULT_FIELDS = ['ショートカット', 'アイテムの使い方', '注意ポイント', '参考動画URL', 'フリーメモ'];

// 初期配置：map.jpg（1920x1080）上のコースアイコン中心座標(px)とコース名
// 位置は道中コースのつながり（隣のコース同士が道でつながる）で検証済み
const PRESET_MAP = 'map_cut.jpg';
const PRESET_SPOTS = [
  ['どんぐりツリーハウス', 955, 95], ['おばけシネマ', 1140, 165], ['クッパキャッスル', 650, 175], ['ホネホネツイスター', 805, 180],
  ['ロゼッタてんもんだい', 1270, 250], ['マリオサーキット', 965, 290], ['キラーシップ', 490, 335], ['キノピオファクトリー', 815, 375],
  ['アイスビルディング', 1420, 370], ['ショーニューロード', 1120, 395], ['ワリオスタジアム', 640, 465], ['モーモーカントリー', 960, 455],
  ['DKスノーマウンテン', 1270, 475], ['ヘイホーカーニバル', 465, 555], ['チョコマウンテン', 795, 570], ['プクプクフォールズ', 1130, 570],
  ['ワリオシップ', 1440, 595], ['ピーチスタジアム', 960, 630], ['ソルティータウン', 1275, 675], ['マリオブラザーズサーキット', 600, 665],
  ['サンサンさばく', 455, 785], ['トロフィーシティ', 800, 795], ['レインボーロード', 960, 785], ['リバーサイドサファリ', 1125, 765],
  ['ピーチビーチ', 1430, 775], ['シュポポコースター', 610, 905], ['ノコノコビーチ', 955, 910], ['DKうちゅうセンター', 815, 945],
  ['ハテナしんでん', 1315, 905], ['ディノディノジャングル', 1155, 975],
];
const MAP_W = 1920, MAP_H = 1080, SPOT_W = 140, SPOT_H = 110;
// map_cut.jpg は map.jpg の左右の海を切り落としたもの（map.jpg 上の (364, 21) から 1195x1059 を切り出し、等倍）
const CUT = { x: 364, y: 21, w: 1195, h: 1059 };
// map.jpg 基準の % 座標を map_cut.jpg 基準に直す
function toCutPct(c) {
  const px = v => v / 100 * MAP_W, py = v => v / 100 * MAP_H;
  c.x = (px(c.x) - CUT.x) / CUT.w * 100;
  c.y = (py(c.y) - CUT.y) / CUT.h * 100;
  c.w = px(c.w) / CUT.w * 100;
  c.h = py(c.h) / CUT.h * 100;
}
// 初代の仮名（見た目の特徴）。PRESET_SPOTS と同じ並び
const OLD_PRESET_NAMES = ['大きな木', 'お化け屋敷（紫）', '火山の城', '溶岩のコース', '氷の宮殿', '迷路の盤面', '飛行船', '黄色と青の工場',
  'お菓子の島', '遺跡（ヘビ像）', 'ネオンのステージ', '風車と牛', '雪山のロッジ', '砂漠の宮殿', '茶色の鉱山', '和風の建物',
  '海賊船', 'ピーチ城', '赤い屋根の建物', '砂漠の渦巻き', 'オアシス', '都会のビル', '海の渦', 'サバンナ',
  'ピンクのお城', '汽車', '南の島', '海の工場', '緑の遺跡（右下）', '恐竜'];
const OFFICIAL_NAMES = PRESET_SPOTS.map(s => s[0]);

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function presetData() {
  return {
    image: PRESET_MAP, fields: DEFAULT_FIELDS.slice(), showLabels: false, layoutVersion: 2,
    extra: {}, extraU: {}, tomb: {}, settingsU: 0,
    pristine: true,  // まだ一度も編集していない（同期時はGitHub側のデータをそのまま使う）
    courses: PRESET_SPOTS.map(([name, cx, cy], i) => ({
      id: 'p' + i, key: name, name, notes: {}, u: 0,
      x: (cx - SPOT_W / 2 - CUT.x) / CUT.w * 100, y: (cy - SPOT_H / 2 - CUT.y) / CUT.h * 100,
      w: SPOT_W / CUT.w * 100, h: SPOT_H / CUT.h * 100,
    })),
  };
}

// 旧バージョンの保存データを今の形に直す。
// key（正式名）が無い枠は、位置が一番近い初期配置のコースとみなす（仮名・旧配置の名前も正式名に直す）
function migrate(d) {
  d.extra = d.extra || {};
  d.extraU = d.extraU || {};
  d.tomb = d.tomb || {};
  d.settingsU = d.settingsU || 0;
  if (d.pristine === undefined) d.pristine = false;
  if (JSON.stringify(d.fields) === JSON.stringify(OLD_DEFAULT_FIELDS)) {
    d.fields = DEFAULT_FIELDS.slice();
    d.settingsU = Date.now();
    const moveSC = n => { if (n && n['ショートカット'] && !n['主要SC']) n['主要SC'] = n['ショートカット']; };
    d.courses.forEach(c => moveSC(c.notes));
    Object.values(d.extra).forEach(moveSC);
  }
  // 配置v2：サンサンさばくとマリオブラザーズサーキットの位置が逆だったので、保存済みの key を位置から付け直す
  if ((d.layoutVersion || 1) < 2) {
    for (const c of d.courses) {
      if (c.key === 'サンサンさばく' || c.key === 'マリオブラザーズサーキット') delete c.key;
    }
    d.layoutVersion = 2;
  }
  for (const c of d.courses) {
    // 位置からの key 付けは map.jpg 時代のデータだけ（座標の基準が map.jpg のため）
    if (c.key || d.image !== 'map.jpg') continue;
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    let best = null, bestDist = 4;
    PRESET_SPOTS.forEach(([name, px, py]) => {
      const dist = Math.hypot(cx - px / MAP_W * 100, cy - py / MAP_H * 100);
      if (dist < bestDist) { best = name; bestDist = dist; }
    });
    if (!best) continue;
    c.key = best;
    if (OLD_PRESET_NAMES.includes(c.name) || OFFICIAL_NAMES.includes(c.name)) c.name = best;
  }
  // 背景を余白なしの map_cut.jpg に切り替え、枠の位置もそれに合わせて直す
  if (d.image === 'map.jpg') {
    const now = Date.now();
    d.courses.forEach(c => { toCutPct(c); c.u = now; });
    d.image = 'map_cut.jpg';
    d.settingsU = now;
  }

  // 削除されたコース枠を初期位置に戻す（コースは増減しないため、30コースは常にそろえる）
  if (d.image !== 'map.jpg') {
    const preset = presetData().courses;
    const now = Date.now();
    preset.forEach(p => {
      if (d.courses.some(c => c.key === p.key)) return;
      const id = d.courses.some(c => c.id === p.id) ? newId() : p.id;
      d.courses.push({ ...p, id, u: now });
      delete d.tomb[id];
    });
  }
  return d;
}

// ---------- 変更時刻の記録（端末間でメモを合体するときに新しい方を残すため）----------
function touchCourse(c) { c.u = Date.now(); data.pristine = false; }
function touchExtra(key) { data.extraU[key] = Date.now(); data.pristine = false; }
function touchSettings() { data.settingsU = Date.now(); data.pristine = false; }

// 2つのデータを合体する。コース枠・道中/SFCメモ・設定ごとに、変更時刻が新しい方を残す（同時刻なら a を優先）
function mergeData(a, b) {
  const tomb = { ...b.tomb };
  for (const [k, t] of Object.entries(a.tomb)) tomb[k] = Math.max(tomb[k] || 0, t);

  const byId = new Map();
  for (const c of [...a.courses, ...b.courses]) {
    const cur = byId.get(c.id);
    if (!cur || (c.u || 0) > (cur.u || 0)) byId.set(c.id, c);
  }
  const courses = [...byId.values()].filter(c => !(tomb[c.id] >= (c.u || 0)));

  const extra = {}, extraU = {};
  const keys = new Set([...Object.keys(a.extra), ...Object.keys(b.extra), ...Object.keys(a.extraU), ...Object.keys(b.extraU)]);
  for (const k of keys) {
    const side = (a.extraU[k] || 0) >= (b.extraU[k] || 0) ? a : b;
    if (side.extra[k]) extra[k] = side.extra[k];
    extraU[k] = Math.max(a.extraU[k] || 0, b.extraU[k] || 0);
  }

  const s = (a.settingsU || 0) >= (b.settingsU || 0) ? a : b;
  return {
    image: s.image, fields: s.fields, showLabels: s.showLabels, settingsU: s.settingsU || 0,
    layoutVersion: Math.max(a.layoutVersion || 1, b.layoutVersion || 1),
    courses, tomb, extra, extraU, pristine: false,
  };
}

// ---------- GitHub同期（非公開リポジトリの data.json に保存）----------
const SYNC_KEY = 'mkworld-sync-v1';
let sync = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');  // { owner, repo, token }
let remoteSha = null;
let pushTimer = null, busy = false, again = false, lastPull = 0;
// 起動直後の取り込みが終わったか（まっさらな端末では、それまで一覧をスケルトン表示にする）
let firstPullDone = false;

const b64enc = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), ch => ch.charCodeAt(0)));

// トーストを出す（kind: 'error' で赤）
let toastTimer = null;
function toast(msg, kind = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = `show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = kind; }, kind === 'error' ? 3500 : 2000);
}

function setSyncState(text, title = '') {
  const el = $('syncState');
  el.textContent = text;
  el.title = title;
}

function ghFetch(method, body, accept = 'application/vnd.github+json') {
  return fetch(`https://api.github.com/repos/${encodeURIComponent(sync.owner)}/${encodeURIComponent(sync.repo)}/contents/data.json`, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${sync.token}`, Accept: accept },
    body: body ? JSON.stringify(body) : undefined,
  });
}

function syncError(res) {
  const msg = res.status === 401 ? 'トークンが無効か期限切れです'
    : res.status === 403 ? 'トークンにこのリポジトリへの書き込み権限がありません'
    : res.status === 404 ? 'リポジトリが見つかりません（ユーザー名・リポジトリ名・トークンの対象を確認）'
    : `GitHubエラー (${res.status})`;
  setSyncState('☁⚠', msg);
  toast(`同期できませんでした：${msg}`, 'error');
  return msg;
}

// GitHub上のデータを取り込み、端末のデータと合体する。差分があればGitHubにも書き戻す
async function pull(options = {}, conflicts = 0) {
  if (!sync) return;
  if (busy) { again = true; return; }
  busy = true;
  let needPush = false;
  setSyncState('☁…', '同期中');
  try {
    lastPull = Date.now();
    const res = await ghFetch('GET');
    if (res.status === 404) {
      // data.json がまだ無い（初回）：リポジトリ自体があるか確認してから作成する
      const repoRes = await fetch(`https://api.github.com/repos/${encodeURIComponent(sync.owner)}/${encodeURIComponent(sync.repo)}`,
        { headers: { Authorization: `Bearer ${sync.token}` }, cache: 'no-store' });
      if (!repoRes.ok) throw new Error(syncError(repoRes));
      remoteSha = null;
      needPush = true;
    } else {
      if (!res.ok) throw new Error(syncError(res));
      const meta = await res.json();
      remoteSha = meta.sha;
      // 1MBを超えるファイルは content が空で返るので、生データを取り直す
      const text = meta.content ? b64dec(meta.content)
        : await (await ghFetch('GET', null, 'application/vnd.github.raw+json')).text();
      const remote = migrate(JSON.parse(text));
      const before = JSON.stringify(data);
      data = (options.replaceLocal || data.pristine) ? remote : mergeData(data, remote);
      if (firstPullDone && JSON.stringify(data) !== before) toast('ほかの端末のメモを読み込みました');
      saveLocal();
      render();
      needPush = JSON.stringify(data) !== JSON.stringify(remote);
      if (!needPush) setSyncState('☁✓', '同期済み');
    }
  } catch (e) {
    console.error(e);
    if (!$('syncState').textContent.includes('⚠')) setSyncState('☁⚠', '通信できませんでした（オフライン？）');
  }
  busy = false;
  if (!firstPullDone) { firstPullDone = true; renderList(); }
  if (needPush) return push(conflicts);
  else if (again) { again = false; pull(); }
}

// 端末のデータをGitHubに書き込む。他の端末が先に保存していたら（409/422）取り込み直して合体してから再保存
async function push(conflicts = 0) {
  if (!sync) return;
  if (busy) { again = true; return; }
  busy = true;
  let needPull = false;
  setSyncState('☁…', '同期中');
  try {
    const res = await ghFetch('PUT', {
      message: `update notes ${new Date().toISOString()}`,
      content: b64enc(JSON.stringify(data)),
      ...(remoteSha ? { sha: remoteSha } : {}),
    });
    if ((res.status === 409 || res.status === 422) && conflicts < 2) {
      needPull = true;
    } else {
      if (!res.ok) throw new Error(syncError(res));
      remoteSha = (await res.json()).content.sha;
      setSyncState('☁✓', '同期済み');
    }
  } catch (e) {
    console.error(e);
    if (!$('syncState').textContent.includes('⚠')) setSyncState('☁⚠', '通信できませんでした（オフライン？）');
  }
  busy = false;
  if (needPull) return pull({}, conflicts + 1);
  else if (again) { again = false; pull(); }
}

// GitHub側を端末のデータでそのまま置き換える（バックアップから読み込んだとき用）
async function forceReplaceRemote() {
  try {
    const res = await ghFetch('GET');
    if (res.ok) remoteSha = (await res.json()).sha;
  } catch (e) { console.error(e); }
  push();
}

function schedulePush() {
  if (!sync) return;
  setSyncState('☁…', '保存待ち');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => push(), 1500);
}

  return [`SFCコース（${sfcParent(t.name)}から選択）`];
}

// 一覧やリンク用のボタン
function noteButton(t, label) {
  const b = document.createElement('button');
  const n = filledCount(t);
  const scs = getScList(getNotes(t)).map(x => scHtml(x.need)).filter(Boolean).join(' ');
  const avg = rankAvg(getRanks(getNotes(t)));
  const len = t.type === 'route' ? getLength(getNotes(t)) : 0;
  const st = [styleHtml(parseStyle(getNotes(t))), scs, avg ? `Ave ${avg}${ordSuffix(+avg)}` : ''].filter(Boolean).join(' ');
  // 何項目入力したかの数や道の長さは出さない。★などが無く、文章のメモや道の長さだけのときは「メモあり」
  const memo = n || len;
  b.innerHTML = `${nameHtml(label)}<small class="${memo || st ? '' : 'none'}">${st || (memo ? 'メモあり' : '未入力')}</small>`;
  b.onclick = () => openNote(t);
  return b;
}

// ---------- 画面描画 ----------
function render() {
  document.body.classList.toggle('showLabels', !!data.showLabels);
  $('modeBtn').classList.toggle('on', editMode);
  $('modeBtn').textContent = editMode ? '編集中' : '編集';
  $('hint').textContent = editMode
    ? '編集モード：枠はドラッグで移動／枠をタップで内容を編集'
    : 'コースをタップすると立ち回りメモが開きます（そのコースから行ける道中コースもそこから開けます）';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  renderStage();
  renderList();
}

function renderStage() {
  const stage = $('stage');
  stage.innerHTML = '';
  if (!data.image) {
    stage.className = 'empty';
    stage.innerHTML = '<p>コース選択画面のスクショを背景に設定してください</p><button class="primary" id="pickImg">画像を選ぶ</button>';
    $('pickImg').onclick = () => $('imageFile').click();
    return;
  }
  stage.className = '';
  const img = document.createElement('img');
  img.src = data.image;
  if (!img.complete) {
    stage.classList.add('loading', 'skel');
    img.onload = img.onerror = () => stage.classList.remove('loading', 'skel');
  }
  img.draggable = false;
  stage.appendChild(img);

  for (const c of data.courses) {
    const el = document.createElement('div');
    el.className = 'spot ' + (editMode ? 'edit' : 'view');
    Object.assign(el.style, { left: c.x + '%', top: c.y + '%', width: c.w + '%', height: c.h + '%' });
    el.innerHTML = `<span class="label">${nameHtml(c.name)}</span>`;
    if (editMode) enableDrag(el, c);
    else el.onclick = e => { e.stopPropagation(); openNote({ type: 'course', id: c.id }); };
    stage.appendChild(el);
  }

  // コースは増減しないので、枠の追加はしない
  stage.onclick = null;
}

// 枠のドラッグ移動（少しでも動いたら移動、動かなければタップ＝編集を開く）
function enableDrag(el, c) {
  el.onpointerdown = e => {
    e.preventDefault();
    e.stopPropagation();
    const r = $('stage').getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, ox = c.x, oy = c.y;
    let moved = false;
    el.setPointerCapture(e.pointerId);
    el.onpointermove = ev => {
      if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 6) moved = true;
      if (!moved) return;
      c.x = clamp(ox + (ev.clientX - sx) / r.width * 100, 0, 100 - c.w);
      c.y = clamp(oy + (ev.clientY - sy) / r.height * 100, 0, 100 - c.h);
      el.style.left = c.x + '%';
      el.style.top = c.y + '%';
    };
    el.onpointerup = () => {
      el.onpointermove = el.onpointerup = null;
      if (moved) { touchCourse(c); saveData(); }
      else openNote({ type: 'course', id: c.id }, true);
    };
  };
}

function renderList() {
  const list = $('list');
  if (sync && data.pristine && !firstPullDone) {
    list.innerHTML = '<div class="skel"></div>'.repeat(8);
    return;
  }
  const q = $('search').value.trim();
  const hit = s => !q || s.includes(q);
  list.innerHTML = '';
  let items = [];
  if (tab === 'course') {
    items = data.courses.slice().sort((a, b) => a.name.localeCompare(b.name, 'ja'))
      .filter(c => hit(c.name)).map(c => [{ type: 'course', id: c.id }, c.name]);
  } else if (tab === 'route') {
    items = ROUTES.map(([from, to]) => [{ type: 'route', from, to }, `${displayName(from)} → ${displayName(to)}`])
      .filter(([, label]) => hit(label));
  } else {
    items = Object.entries(SFC_COURSES).flatMap(([parent, names]) => names.map(n => [{ type: 'sfc', name: n }, n, parent]))
      .filter(([, n, parent]) => hit(n) || hit(parent)).map(([t, n]) => [t, n]);
  }
  if (!items.length) { list.innerHTML = '<p class="hint">該当するコースがありません</p>'; return; }
  for (const [t, label] of items) list.appendChild(noteButton(t, label));
}

// ---------- メモの表示・編集シート ----------
let currentNote = null;  // 開いているシート { t, asEdit }（キーボード操作用）
function openNote(t, asEdit = false, focusField = null) {
  currentNote = { t, asEdit };
  const course = t.type === 'course' ? data.courses.find(c => c.id === t.id) : null;
  if (t.type === 'course' && !course) return;
  const sheet = $('noteSheet');
  const notes = getNotes(t);
  const tags = tagsOf(t);
  const chips = tags.length ? `<div class="chips">${tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';
  // 道中・SFCコースからは元の周回コースに戻れるようにする
  const parentKey = t.type === 'route' ? t.from : t.type === 'sfc' ? sfcParent(t.name) : null;
  const parentCourse = parentKey && courseByKey(parentKey);
  const back = parentCourse ? `<button class="back" id="backBtn">‹ ${esc(parentCourse.name)} に戻る</button>` : '';

  if (!asEdit) {
    const st = styleHtml(parseStyle(notes), true);
    sheet.innerHTML = back + chips + `<h3><span class="title">${nameHtml(titleOf(t))}</span></h3>` +
      // 見出しは付けず、未入力のときは空の☆を薄く出す
      '<div class="field"><div class="body" id="styleView"></div></div>' +
      (t.type === 'route' ? '<div class="field"><div class="body" id="lengthView"></div></div>' : '') +
      '<div class="field" id="rankBox"></div>' +
      data.fields.map(f => {
      if (f === SC_FIELD) {
        const list = getScList(notes);
        const items = list.map(x => {
          const pos = scPosText(x);
          return `<div class="sc-item"><div class="body">${pos ? `<span class="pos">${esc(pos)}</span>` : ''}${x.text ? `<div class="${pos ? 'memo' : ''}">${linkify(x.text)}</div>` : ''}</div>${scHtml(x.need, true)}</div>`;
        }).join('');
        return `<div class="field" data-edit="${esc(f)}"><div class="name">${esc(f)}${list.length > 1 ? `（${list.length}）` : ''}</div>${items || '<div class="body blank">（未入力）</div>'}</div>`;
      }
      const v = (notes[f] || '').trim();
      if (POINT_PICKS[f]) {
        const pos = scPosText(getPick(notes, f));
        if (pos) return `<div class="field" data-edit="${esc(f)}"><div class="name">${fieldLabel(f)}</div><div class="sc-item"><div class="body"><span class="pos">${esc(pos)}</span>${v ? `<div class="memo">${linkify(v)}</div>` : ''}</div></div></div>`;
      }
      return `<div class="field" data-edit="${esc(f)}"><div class="name">${fieldLabel(f)}</div><div class="body ${v ? '' : 'blank'}">${v ? linkify(v) : 'タップして入力'}</div></div>`;
    }).join('') + '<div id="related"></div>' +
      `<div class="row"><button id="toEdit">✏️ 編集する</button><button class="primary" id="closeN">閉じる</button></div>`;
    if (course) renderRelated(course.key || course.name);
    renderRank(t);
    $('toEdit').onclick = () => openNote(t, true);
    // 項目をタップしたら、その項目を編集する画面へ（リンクのタップはそのまま開く）
    sheet.querySelectorAll('[data-edit]').forEach(el => el.onclick = e => {
      if (e.target.closest('a')) return;
      openNote(t, true, el.dataset.edit);
    });
    // ★をその場でタップして保存（同じ★をもう一度で外す）
    const drawRatingView = (boxId, read, key, left, right, label) => {
      const box = $(boxId);
      if (!box) return;
      const lv = read(getNotes(t));
      box.innerHTML = `<span class="style-end">${left}</span><span class="style big">` +
        [1, 2, 3, 4, 5].map(i => `<button class="style-tap${i <= lv ? '' : ' off'}" data-lv="${i}" aria-label="${label}★${i}">${i <= lv ? '★' : '☆'}</button>`).join('') +
        `</span><span class="style-end">${right}</span>`;
      box.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
        const v = +b.dataset.lv === lv ? 0 : +b.dataset.lv;
        const extra = key === STYLE_KEY ? { [OLD_STYLE_KEY]: '', '前張り/打開': '' } : {};
        setNotes(t, { ...getNotes(t), [key]: v ? String(v) : '', ...extra });
        saveData();
        renderList();
        drawRatingView(boxId, read, key, left, right, label);
        toast(v ? `${label}を★${v}にしました` : `${label}の★を外しました`);
      });
    };
    drawRatingView('styleView', parseStyle, STYLE_KEY, '前張り', '打開', '前張り/打開');
    // 道の長さ：青いメーター（同じ所をもう一度タップで外す）
    const drawLengthView = () => {
      const box = $('lengthView');
      if (!box) return;
      const lv = getLength(getNotes(t));
      box.innerHTML = '<div class="meter-wrap"><span class="style-end">短</span><span class="meter">' +
        [1, 2, 3, 4, 5].map(i => `<button class="${i <= lv ? 'on' : ''}" data-lv="${i}" aria-label="道の長さ${i}"></button>`).join('') +
        '</span><span class="style-end">長</span></div>';
      box.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
        const v = +b.dataset.lv === lv ? 0 : +b.dataset.lv;
        setNotes(t, { ...getNotes(t), [LENGTH_KEY]: v ? String(v) : '' });
        saveData();
        renderList();
        drawLengthView();
        toast(v ? `道の長さを${v}にしました` : '道の長さを外しました');
      });
    };
    drawLengthView();
    $('closeN').onclick = closeNote;
  } else {
    sheet.innerHTML = back + chips + `<h3><span class="title">${nameHtml(titleOf(t))}</span></h3>` +
      (course ? `<div class="field"><div class="name">コース名</div><input type="text" id="cName" value="${esc(course.name)}"></div>` : '') +
      `<div class="field"><div class="style-edit" id="styleEdit"></div><div class="style-hint">★1＝前張り寄り ／ ★5＝打開寄り</div></div>` +
      (t.type === 'route' ? `<div class="field"><div class="style-edit meter-wrap" id="lengthEdit"></div><div class="style-hint">道の長さ</div></div>` : '') +
      data.fields.map((f, i) => `<div class="field" data-field="${esc(f)}"><div class="name">${fieldLabel(f)}</div>${f === SC_FIELD ? '<div id="scList"></div><button class="sc-add" id="scAdd">＋ SCを追加</button>'
        : POINT_PICKS[f] ? `<div class="sc-pick" data-pick="${esc(f)}"></div><textarea data-f="${i}" placeholder="補足（任意）">${esc(notes[f] || '')}</textarea>`
        : `<textarea data-f="${i}">${esc(notes[f] || '')}</textarea>`}</div>`).join('') +
      (course && data.image ? `
        <label class="slider">枠の幅 <input type="range" id="cW" min="3" max="50" step="0.5" value="${course.w}"></label>
        <label class="slider">枠の高さ <input type="range" id="cH" min="3" max="50" step="0.5" value="${course.h}"></label>` : '') +
      `<div class="row"><button class="danger" id="delN">メモを消す</button><button class="primary" id="saveN">保存</button></div>`;
    if (course && data.image) {
      // スライダーで枠サイズを変えるとすぐ背景上に反映
      const live = () => {
        course.w = +$('cW').value; course.h = +$('cH').value;
        course.x = clamp(course.x, 0, 100 - course.w); course.y = clamp(course.y, 0, 100 - course.h);
        touchCourse(course);
        renderStage();
      };
      $('cW').oninput = live;
      $('cH').oninput = live;
    }
    // 前張り ★★★★★ 打開。タップした位置までが打開度
    let style = parseStyle(notes);
    const drawStyle = () => {
      $('styleEdit').innerHTML = '<span class="style-end">前張り</span>' +
        [1, 2, 3, 4, 5].map(i => `<button class="star${i <= style ? ' on' : ''}" data-lv="${i}">${i <= style ? '★' : '☆'}</button>`).join('') +
        '<span class="style-end">打開</span><button class="clear" data-lv="0">クリア</button>';
      $('styleEdit').querySelectorAll('button').forEach(b => b.onclick = () => { style = +b.dataset.lv; drawStyle(); });
    };
    drawStyle();

    // 道の長さ（道中だけ）
    let length = getLength(notes);
    const drawLength = () => {
      if (!$('lengthEdit')) return;
      $('lengthEdit').innerHTML = '<span class="style-end">短</span><span class="meter">' +
        [1, 2, 3, 4, 5].map(i => `<button class="${i <= length ? 'on' : ''}" data-lv="${i}" aria-label="道の長さ${i}"></button>`).join('') +
        '</span><span class="style-end">長</span><button class="clear" data-lv="0">クリア</button>';
      $('lengthEdit').querySelectorAll('button').forEach(b => b.onclick = () => { length = +b.dataset.lv; drawLength(); });
    };
    drawLength();

    // 主要SC：1件ごとに ①アイテム番号 ②前/後 ③左側/右側 ④キノコ を選び、補足は自由入力。＋で追加、削除で消す
    // 選んでいるボタンをもう一度タップすると選択を外す
    const blankSc = () => ({ box: '', fb: '', lr: '', need: '', text: '' });
    const scItems = getScList(notes).map(x => ({ ...blankSc(), ...x }));
    if (!scItems.length) scItems.push(blankSc());
    const pickRow = (i, key, label, values, show = v => esc(v)) => `
      <div class="lbl">${label}</div>
      <div class="opts">${values.map(v => `<button class="${scItems[i][key] === v ? 'on' : ''}" data-i="${i}" data-key="${key}" data-v="${v}">${show(v)}</button>`).join('')}</div>`;
    const drawSc = () => {
      if (!$('scList')) return;
      $('scList').innerHTML = scItems.map((x, i) => `
        <div class="sc-row">
          <div class="head">SC ${i + 1}<button class="del" data-del="${i}">削除</button></div>
          <div class="sc-pick">
            ${pickRow(i, 'box', 'アイテム', SC_BOXES[t.type])}
            ${pickRow(i, 'fb', '前後', SC_SIDES_FB)}
            ${pickRow(i, 'lr', '左右', SC_SIDES_LR)}
            ${pickRow(i, 'need', 'キノコ', SC_OPTIONS, v => scHtml(v))}
          </div>
          <textarea data-sc-text="${i}" placeholder="補足（任意）">${esc(x.text)}</textarea>
        </div>`).join('');
      $('scList').querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
        const x = scItems[+b.dataset.i], k = b.dataset.key;
        x[k] = x[k] === b.dataset.v ? '' : b.dataset.v;
        drawSc();
      });
      $('scList').querySelectorAll('[data-sc-text]').forEach(el => el.oninput = () => { scItems[+el.dataset.scText].text = el.value; });
      $('scList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { scItems.splice(+b.dataset.del, 1); drawSc(); });
    };
    drawSc();
    if ($('scAdd')) $('scAdd').onclick = () => {
      scItems.push(blankSc());
      drawSc();
      $('scList').lastElementChild.scrollIntoView({ block: 'nearest' });
    };

    // キラー・サンダーポイントの選択ボタン（選んでいるボタンをもう一度タップすると外す）
    const picks = {};
    sheet.querySelectorAll('[data-pick]').forEach(box => {
      const f = box.dataset.pick;
      picks[f] = getPick(notes, f);
      const draw = () => {
        const row = (key, label, values) => `<div class="lbl">${label}</div><div class="opts">${values.map(v =>
          `<button class="${picks[f][key] === v ? 'on' : ''}" data-key="${key}" data-v="${v}">${esc(v)}</button>`).join('')}</div>`;
        box.innerHTML = row('box', 'アイテム', SC_BOXES[t.type]) + (POINT_PICKS[f].fb ? row('fb', '前後', SC_SIDES_FB) : '');
        box.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
          const k = b.dataset.key;
          picks[f][k] = picks[f][k] === b.dataset.v ? '' : b.dataset.v;
          draw();
        });
      };
      draw();
    });

    $('saveN').onclick = () => {
      if (course) course.name = $('cName').value.trim() || '名称未設定';
      const scList = scItems.map(x => ({ box: x.box, fb: x.fb, lr: x.lr, need: x.need, text: x.text.trim() })).filter(scFilled);
      // 主要SCはリストに一本化し、1件だけだった頃の保存先は空にする
      const next = { [STYLE_KEY]: style ? String(style) : '', [OLD_STYLE_KEY]: '',
        ...(t.type === 'route' ? { [LENGTH_KEY]: length ? String(length) : '' } : {}), [SC_LIST_KEY]: scList.length ? JSON.stringify(scList) : '',
        [SC_FIELD]: '', [SC_KEY]: '', '前張り/打開': '' };
      sheet.querySelectorAll('textarea[data-f]').forEach(el => { next[data.fields[+el.dataset.f]] = el.value; });
      for (const [f, v] of Object.entries(picks)) {
        const val = POINT_PICKS[f].fb ? { box: v.box, fb: v.fb } : { box: v.box };
        next[POINT_PICKS[f].key] = Object.values(val).some(Boolean) ? JSON.stringify(val) : '';
      }
      setNotes(t, { ...notes, ...next });
      saveData();
      render();
      openNote(t, false);
      toast('保存しました');
    };
    $('delN').onclick = () => {
      // 枠は消さず、メモだけ消す
      if (!confirm('このコースのメモを消しますか？（順位の記録は残ります）')) return;
      setNotes(t, { [RANK_KEY]: notes[RANK_KEY] || '' });
      saveData();
      render();
      openNote(t, false);
      toast('メモを消しました');
    };
  }
  if (parentCourse) $('backBtn').onclick = () => openNote({ type: 'course', id: parentCourse.id });
  $('noteBg').classList.add('open');
  sheet.scrollTop = 0;
  if (asEdit && focusField) {
    const el = [...sheet.querySelectorAll('[data-field]')].find(x => x.dataset.field === focusField);
    if (el) {
      el.scrollIntoView({ block: 'start' });
      const ta = el.querySelector('textarea');
      // 選択式の項目はボタンを押すことが多いので、文章だけの項目のときにキーボードを出す
      if (ta && !el.querySelector('.sc-pick, #scList')) ta.focus();
    }
  }
}

// 平均順位の欄。「＋ 順位を記録」で1〜24位のボタンを出し、タップで記録する
function renderRank(t, padOpen = false) {
  const box = $('rankBox');
  if (!box) return;
  const ranks = getRanks(getNotes(t));
  const avg = rankAvg(ranks);
  // 平均と戦数を左、「＋記録」「取り消し」を右に1行で並べる
  const actions = `<span class="rank-actions">${ranks.length ? '<button class="undo" id="rankUndo">取り消し</button>' : ''}<button id="rankAdd">${padOpen ? '閉じる' : '＋ 記録'}</button></span>`;
  box.innerHTML = `<div class="name">Ave</div>` +
    `<div class="rank-head">${avg ? `<span class="rank-avg">${avg}<small>${ordSuffix(+avg)}</small></span><span class="rank-n">${ranks.length}戦</span>`
      : '<span class="body blank">まだ記録がありません</span>'}${actions}</div>` +
    // 過去の順位は平均の計算用に保存するだけで、一覧表示はしない
    (padOpen ? `<div class="rank-pad">${Array.from({ length: RANK_MAX }, (_, i) => `<button data-rank="${i + 1}">${i + 1}<small>${ordSuffix(i + 1)}</small></button>`).join('')}</div>` : '');
  const save = next => {
    setNotes(t, { ...getNotes(t), [RANK_KEY]: next.length ? JSON.stringify(next) : '' });
    saveData();
    renderList();
  };
  $('rankAdd').onclick = () => renderRank(t, !padOpen);
  if ($('rankUndo')) $('rankUndo').onclick = () => {
    const next = ranks.slice(0, -1);
    save(next);
    renderRank(t, padOpen);
    toast(`${ord(ranks[ranks.length - 1])}の記録を取り消しました`);
  };
  box.querySelectorAll('[data-rank]').forEach(b => b.onclick = () => {
    const next = [...ranks, +b.dataset.rank];
    save(next);
    renderRank(t, false);
    toast(`${ord(+b.dataset.rank)}を記録しました（Ave ${rankAvg(next)}${ordSuffix(+rankAvg(next))}）`);
  });
}

// 周回コースのシートに、SFCコースと出発する道中コースを並べる
function renderRelated(key) {
  const box = $('related');
  const section = (title, items) => {
    if (!items.length) return;
    box.insertAdjacentHTML('beforeend', `<h4>${esc(title)}</h4>`);
    const wrap = document.createElement('div');
    wrap.className = 'links';
    items.forEach(([t, label]) => wrap.appendChild(noteButton(t, label)));
    box.appendChild(wrap);
  };
  section('SFCコース', (SFC_COURSES[key] || []).map(n => [{ type: 'sfc', name: n }, n]));
  section('ここから出発する道中コース', ROUTES.filter(r => r[0] === key).map(r => [{ type: 'route', from: r[0], to: r[1] }, `→ ${displayName(r[1])}`]));}

function closeNote() {
  currentNote = null;
  $('noteBg').classList.remove('open');
  saveData();
  render();
}
$('noteBg').onclick = e => { if (e.target.id === 'noteBg') closeNote(); };

// ---------- キーボード操作（PC・iPadのキーボード用）----------
// Esc：ひとつ前の画面に戻る ／ Ctrl+Enter（Macは⌘+Enter）：保存
document.addEventListener('keydown', e => {
  const open = id => $(id).classList.contains('open');
  if (e.key === 'Escape') {
    if (open('syncBg')) $('syncBg').classList.remove('open');
    else if (open('menuBg')) closeMenu();
    else if (open('noteBg') && currentNote) {
      if (currentNote.asEdit) openNote(currentNote.t, false);   // 編集 → 表示（保存はしない）
      else if ($('backBtn')) $('backBtn').click();              // 道中・SFC → 元の周回コース
      else closeNote();
    } else return;
    e.preventDefault();
  } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    if (open('noteBg') && currentNote?.asEdit) $('saveN').click();
    else if (open('syncBg')) $('sSave').click();
    else return;
    e.preventDefault();
  }
});

// ---------- 一覧のタブ・検索 ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$('search').oninput = renderList;

// ---------- ヘッダー・メニュー ----------
$('modeBtn').onclick = () => { editMode = !editMode; render(); };
$('menuBtn').onclick = () => { $('labelState').textContent = data.showLabels ? 'ON' : 'OFF'; $('menuBg').classList.add('open'); };
const closeMenu = () => $('menuBg').classList.remove('open');
$('mClose').onclick = closeMenu;
$('menuBg').onclick = e => { if (e.target.id === 'menuBg') closeMenu(); };

$('mLabels').onclick = () => {
  data.showLabels = !data.showLabels;
  touchSettings();
  $('labelState').textContent = data.showLabels ? 'ON' : 'OFF';
  saveData();
  render();
};
$('mImage').onclick = () => { closeMenu(); $('imageFile').click(); };
$('mPreset').onclick = () => {
  if (!confirm('マップとコース枠を初期配置に戻します。周回・道中・SFCコースのメモもすべて消えます（同期中なら他の端末からも消えます）。よろしいですか？')) return;
  // 同期先でも消えるよう、今ある枠とメモに削除の印を付けてから初期配置を作る
  const now = Date.now();
  const tomb = { ...data.tomb }, extraU = { ...data.extraU };
  data.courses.forEach(c => { tomb[c.id] = now; });
  Object.keys(data.extra).forEach(k => { extraU[k] = now; });
  data = presetData();
  Object.assign(data, { tomb, extraU, settingsU: now + 1, pristine: false });
  data.courses.forEach(c => { c.u = now + 1; });
  saveData();
  closeMenu();
  render();
  toast('初期配置に戻しました');
};

$('mFields').onclick = () => {
  const input = prompt('メモ項目を「 / 」区切りで入力してください\n（項目名を変えると、その項目の既存メモは表示されなくなります）', data.fields.join(' / '));
  if (input === null) return;
  const fields = input.split('/').map(s => s.trim()).filter(Boolean);
  if (!fields.length) return;
  data.fields = fields;
  touchSettings();
  saveData();
  render();
  closeMenu();
  toast('メモ項目を変更しました');
};

// 背景画像：端末の容量を節約するため縮小して保存
$('imageFile').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      data.image = cv.toDataURL('image/jpeg', 0.82);
      touchSettings();
      saveData();
      render();
      toast('背景画像を変更しました');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};

// 書き出し：メモ一式のJSONファイルをダウンロード
$('mExport').onclick = () => {
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `mkworld-notes_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('書き出しました');
};

// ---------- GitHub同期の設定シート ----------
$('mSync').onclick = () => {
  closeMenu();
  $('sOwner').value = sync?.owner || '';
  $('sRepo').value = sync?.repo || 'mkworld-data';
  $('sToken').value = sync?.token || '';
  $('syncMsg').textContent = sync ? `状態：${$('syncState').title || '設定済み'}` : '状態：未設定';
  $('syncBg').classList.add('open');
};
$('syncState').onclick = () => $('mSync').onclick();
$('sClose').onclick = () => $('syncBg').classList.remove('open');
$('syncBg').onclick = e => { if (e.target.id === 'syncBg') $('syncBg').classList.remove('open'); };

$('sSave').onclick = async () => {
  const owner = $('sOwner').value.trim(), repo = $('sRepo').value.trim(), token = $('sToken').value.trim();
  if (!owner || !repo || !token) { $('syncMsg').textContent = '3つとも入力してください'; return; }
  const firstTime = !sync || sync.owner !== owner || sync.repo !== repo;
  sync = { owner, repo, token };
  localStorage.setItem(SYNC_KEY, JSON.stringify(sync));
  remoteSha = null;
  $('syncMsg').textContent = '接続を確認しています…';
  let replaceLocal = false;
  if (firstTime && !data.pristine) {
    // 同期先にすでにデータがあり、この端末にもメモがある場合はどちらを使うか選んでもらう
    try {
      const res = await ghFetch('GET');
      if (res.ok) {
        replaceLocal = confirm('GitHubにすでにメモがあります。\n\nOK：GitHubのメモを使う（この端末のメモは消えます）\nキャンセル：この端末のメモと合体する');
      }
    } catch (e) { console.error(e); }
  }
  await pull({ replaceLocal });
  $('syncMsg').textContent = `状態：${$('syncState').title}`;
  if ($('syncState').textContent.includes('✓')) toast('GitHubと同期しました');
};

$('sOff').onclick = () => {
  if (!sync || !confirm('この端末の同期を解除しますか？（メモはこの端末とGitHubの両方に残ります）')) return;
  sync = null;
  localStorage.removeItem(SYNC_KEY);
  setSyncState('');
  $('syncMsg').textContent = '状態：未設定';
  toast('同期を解除しました');
};

$('mImport').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.courses) || !Array.isArray(d.fields)) throw new Error('invalid format');
      if (!confirm(`${d.courses.length} コース分のデータを読み込みます。今のデータは上書きされます。よろしいですか？`)) return;
      data = migrate(d);
      data.pristine = false;
      saveLocal();
      closeMenu();
      render();
      toast(`${d.courses.length} コース分のデータを読み込みました`);
      // 読み込んだデータでGitHub側も置き換える（合体はしない）
      if (sync) { clearTimeout(pushTimer); forceReplaceRemote(); }
    } catch (err) {
      alert('読み込めませんでした。このツールで書き出したファイルを選んでください。');
    }
  };
  reader.readAsText(file);
};

// 引っぱって更新：一番上で下に引っぱって離すと、最新の画面とメモを読み込み直す
// （ホーム画面に追加したアプリには、ブラウザの引っぱって更新が無いため）
(() => {
  const PTR_READY = 120;
  let startY = null, dist = 0;
  const show = () => {
    const y = Math.min(dist / 2, 90);
    $('ptr').style.transform = `translate(-50%, ${y - 40}px)`;
    $('ptr').style.opacity = Math.min(dist / PTR_READY, 1);
    $('ptr').classList.toggle('ready', dist >= PTR_READY);
    $('ptrText').textContent = dist >= PTR_READY ? '離すと更新' : '引っぱって更新';
  };
  const hide = () => { $('ptr').style.transform = ''; $('ptr').style.opacity = ''; $('ptr').classList.remove('ready'); };
  window.addEventListener('touchstart', e => {
    // シートを開いているときと、枠をドラッグする編集モードでは使わない
    const ok = window.scrollY <= 0 && !editMode && !document.querySelector('.sheet-bg.open') && e.touches.length === 1;
    startY = ok ? e.touches[0].clientY : null;
    dist = 0;
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (startY === null) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0 || window.scrollY > 0) { dist = 0; hide(); return; }
    show();
  }, { passive: true });
  window.addEventListener('touchend', () => {
    if (startY === null) return;
    startY = null;
    if (dist >= PTR_READY) {
      $('ptrText').textContent = '更新中…';
      // 未送信のメモは端末に保存済みなので、読み込み直した後の同期で送られる
      location.reload();
    } else hide();
  });
})();

// 新しい版の自動チェック：公開版の index.html をキャッシュを使わずに読み、版が違えば読み込み直す
// （iPhoneのホーム画面アプリは古い画面を覚えたままになりやすいため）
async function checkUpdate() {
  if (location.protocol === 'file:') return;
  try {
    const html = await (await fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' })).text();
    const latest = (/APP_VERSION = '([^']+)'/.exec(html) || [])[1];
    if (!latest || latest === APP_VERSION) return;
    // 同じ版への読み込み直しは1回だけ（何かの理由で古いままでも、繰り返さない）
    if (sessionStorage.getItem('mkworld-reloaded') === latest) return;
    sessionStorage.setItem('mkworld-reloaded', latest);
    toast('新しい版に更新します');
    setTimeout(() => location.replace(`${location.pathname}?v=${encodeURIComponent(latest)}`), 600);
  } catch (e) { console.error(e); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

render();
checkUpdate();
$('appVersion').textContent = `版：${APP_VERSION}`;
pull();
</script>
</body>
